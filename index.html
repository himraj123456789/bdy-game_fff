<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बिहार भूमि प्रतिवेदन - जमाबंदी डेटा</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Noto Sans Devanagari', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1450px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);
            padding: 25px 40px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            transform: rotate(45deg);
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: 20%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            backdrop-filter: blur(10px);
        }

        .header-title h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-title p {
            font-size: 14px;
            opacity: 0.85;
            margin-top: 4px;
        }

        .header-stats {
            display: flex;
            gap: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .number {
            font-size: 24px;
            font-weight: 700;
        }

        .stat-item .label {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Controls */
        .controls {
            padding: 20px 40px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .controls-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            background: white;
            font-family: inherit;
        }

        .search-box input:focus {
            outline: none;
            border-color: #1a237e;
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .filter-select {
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .filter-select:focus {
            outline: none;
            border-color: #1a237e;
        }

        .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(26, 35, 126, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #1b5e20, #2e7d32);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(27, 94, 32, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #b71c1c, #c62828);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(183, 28, 28, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #e9ecef;
            color: #495057;
        }

        .btn-outline:hover {
            background: #f8f9fa;
        }

        /* Table Container */
        .table-container {
            padding: 20px 40px 40px;
            overflow-x: auto;
        }

        .table-wrapper {
            border-radius: 12px;
            border: 1px solid #e9ecef;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            font-family: 'Segoe UI', 'Noto Sans Devanagari', Tahoma, Geneva, Verdana, sans-serif;
        }

        thead {
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            color: white;
        }

        thead th {
            padding: 15px 18px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        thead th:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        thead th .sort-icon {
            margin-left: 5px;
            font-size: 11px;
        }

        thead th .sort-icon.active {
            color: #ffd54f;
        }

        tbody tr {
            transition: background 0.2s;
            border-bottom: 1px solid #f1f3f5;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody td {
            padding: 12px 18px;
            color: #212529;
            vertical-align: middle;
            font-family: 'Segoe UI', 'Noto Sans Devanagari', Tahoma, Geneva, Verdana, sans-serif;
        }

        tbody td .link-icon {
            color: #1a237e;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        tbody td .link-icon:hover {
            color: #0d47a1;
            transform: translateX(3px);
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
        }

        .badge-blue {
            background: #e3f2fd;
            color: #1565c0;
        }

        .badge-green {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge-purple {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .badge-orange {
            background: #fff3e0;
            color: #e65100;
        }

        .badge-red {
            background: #ffebee;
            color: #c62828;
        }

        .badge-teal {
            background: #e0f2f1;
            color: #00695c;
        }

        /* Pagination */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 40px 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .pagination-info {
            color: #6c757d;
            font-size: 14px;
            font-family: inherit;
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pagination-btn {
            padding: 8px 14px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: #495057;
            font-family: inherit;
        }

        .pagination-btn:hover:not(:disabled) {
            background: #1a237e;
            color: white;
            border-color: #1a237e;
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-btn.active {
            background: #1a237e;
            color: white;
            border-color: #1a237e;
        }

        /* No Data */
        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .no-data i {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .no-data h3 {
            margin-bottom: 10px;
            color: #495057;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 20px;
            }

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-stats {
                width: 100%;
                justify-content: space-around;
            }

            .controls {
                padding: 15px 20px;
                flex-direction: column;
                align-items: stretch;
            }

            .controls-left {
                flex-direction: column;
            }

            .search-box {
                min-width: auto;
                width: 100%;
            }

            .table-container {
                padding: 10px;
            }

            .pagination {
                flex-direction: column;
                align-items: center;
                padding: 15px 20px;
            }

            thead th,
            tbody td {
                padding: 10px 12px;
                font-size: 12px;
            }

            .header-title h1 {
                font-size: 20px;
            }

            .stat-item .number {
                font-size: 18px;
            }

            .controls-right {
                flex-wrap: wrap;
                justify-content: center;
            }

            .btn {
                padding: 8px 14px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .header-title h1 {
                font-size: 18px;
            }

            .stat-item .number {
                font-size: 16px;
            }

            .header-stats {
                gap: 15px;
                padding: 10px 15px;
            }
        }

        /* Scrollbar */
        .table-wrapper::-webkit-scrollbar {
            height: 8px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #f1f3f5;
            border-radius: 4px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #c3cfe2;
            border-radius: 4px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #a8b8d0;
        }

        /* Number formatting */
        .number-cell {
            font-family: 'Courier New', monospace;
            font-weight: 500;
            font-size: 13px;
        }

        /* Tooltip */
        .tooltip {
            position: relative;
        }

        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #212529;
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 10;
            font-family: inherit;
        }

        /* Name highlight */
        .rayat-name {
            font-weight: 600;
            color: #1a237e;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <div class="header-left">
                    <div class="header-icon">
                        <i class="fas fa-landmark"></i>
                    </div>
                    <div class="header-title">
                        <h1>🏛️ बिहार भूमि प्रतिवेदन</h1>
                        <p>जमाबंदी डेटा - Jamabandi Data Viewer</p>
                    </div>
                </div>
                <div class="header-stats">
                    <div class="stat-item">
                        <div class="number" id="totalRecords">0</div>
                        <div class="label">कुल रिकॉर्ड</div>
                    </div>
                    <div class="stat-item">
                        <div class="number" id="totalPages">0</div>
                        <div class="label">कुल पृष्ठ</div>
                    </div>
                    <div class="stat-item">
                        <div class="number" id="displayCount">0</div>
                        <div class="label">प्रदर्शित</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="controls-left">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="🔍 किसी भी कॉलम में खोजें..." onkeyup="filterTable()">
                </div>
                <select class="filter-select" id="filterSelect" onchange="filterTable()">
                    <option value="all">📋 सभी रिकॉर्ड</option>
                    <option value="volume">📊 भाग के अनुसार</option>
                    <option value="khata">📁 खाता संख्या</option>
                    <option value="plot">📍 प्लाट संख्या</option>
                    <option value="rayat">👤 रैयत के नाम से</option>
                </select>
                <select class="filter-select" id="rowsPerPage" onchange="changeRowsPerPage()">
                    <option value="10">10 पंक्तियाँ</option>
                    <option value="25">25 पंक्तियाँ</option>
                    <option value="50" selected>50 पंक्तियाँ</option>
                    <option value="100">100 पंक्तियाँ</option>
                    <option value="all">सभी पंक्तियाँ</option>
                </select>
            </div>
            <div class="controls-right">
                <button class="btn btn-success" onclick="exportCSV()">
                    <i class="fas fa-file-csv"></i> CSV डाउनलोड
                </button>
                <button class="btn btn-outline" onclick="resetFilters()">
                    <i class="fas fa-undo"></i> रीसेट
                </button>
                <button class="btn btn-primary" onclick="printTable()">
                    <i class="fas fa-print"></i> प्रिंट
                </button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <div class="table-wrapper">
                <table id="dataTable">
                    <thead id="tableHead">
                        <!-- Headers will be inserted here -->
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <div class="pagination-info" id="paginationInfo">
                Showing 0 to 0 of 0 records
            </div>
            <div class="pagination-controls" id="paginationControls">
                <!-- Pagination buttons will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // Data with शिवानन्द नायक as Rayat name - Full integers
        const rawData = [
            ["675", "शिवानन्द नायक", "355", "2", "456", "387", "214113500015375", "https://emutation.bihar.gov.in/biharBhumireport/Reg2Report?d=9&c=7&s=01&h=9&m=262&v=2+++++++++&p=456&k=355&u=214113500015375"],
            ["797", "शिवानन्द नायक", "47", "2", "536", "430", "214113500015455", "https://emutation.bihar.gov.in/biharBhumireport/Reg2Report?d=9&c=7&s=01&h=9&m=262&v=2+++++++++&p=536&k=47&u=214113500015455"],
            ["925", "शिवानन्द नायक", "47", "2", "619", "482", "214113500015538", "https://emutation.bihar.gov.in/biharBhumireport/Reg2Report?d=9&c=7&s=01&h=9&m=262&v=2+++++++++&p=619&k=47&u=214113500015538"],
            ["927", "शिवानन्द नायक", "484", "2", "622", "484", "214113500015541", "https://emutation.bihar.gov.in/biharBhumireport/Reg2Report?d=9&c=7&s=01&h=9&m=262&v=2+++++++++&p=622&k=484&u=214113500015541"],
            ["929", "शिवानन्द नायक", "275", "2", "624", "486", "214113500015543", "https://emutation.bihar.gov.in/biharBhumireport/Reg2Report?d=9&c=7&s=01&h=9&m=262&v=2+++++++++&p=624&k=275&u=214113500015543"],
            ["937", "शिवानन्द नायक", "39", "2", "630", "494", "214113500015549", "https://emutation.bihar.gov.in/biharBhumireport/Reg2Report?d=9&c=7&s=01&h=9&m=262&v=2+++++++++&p=630&k=39&u=214113500015549"],
            ["938", "शिवानन्द नायक", "68", "2", "631", "495", "214113500015550", "https://emutation.bihar.gov.in/biharBhumireport/Reg2Report?d=9&c=7&s=01&h=9&m=262&v=2+++++++++&p=631&k=68&u=214113500015550"],
            ["943", "शिवानन्द नायक", "294", "2", "633", "496", "214113500015552", "https://emutation.bihar.gov.in/biharBhumireport/Reg2Report?d=9&c=7&s=01&h=9&m=262&v=2+++++++++&p=633&k=294&u=214113500015552"],
            ["948", "शिवानन्द नायक", "275", "3", "638", "639", "214113500015557", "https://emutation.bihar.gov.in/biharBhumireport/Reg2Report?d=9&c=7&s=01&h=9&m=262&v=3+++++++++&p=638&k=275&u=214113500015557"],
            ["949", "शिवानन्द नायक", "39", "3", "639", "640", "214113500015558", "https://emutation.bihar.gov.in/biharBhumireport/Reg2Report?d=9&c=7&s=01&h=9&m=262&v=3+++++++++&p=639&k=39&u=214113500015558"],
            ["2293", "शिवानन्द नायक", "72", "8", "97", "493", "214113500114238", "https://emutation.bihar.gov.in/biharBhumireport/Reg2Report?d=9&c=7&s=01&h=9&m=262&v=8&p=97&k=72&u=214113500114238"],
            ["2294", "शिवानन्द नायक", "1", "8", "98", "480", "214113500114239", "https://emutation.bihar.gov.in/biharBhumireport/Reg2Report?d=9&c=7&s=01&h=9&m=262&v=8&p=98&k=1&u=214113500114239"]
        ];

        // Column headers with Hindi
        const columnHeaders = [
            { key: 'slNo', label: 'क्र.सं.', english: 'SL No' },
            { key: 'rayatName', label: 'रैयत का नाम', english: 'Rayat Name' },
            { key: 'khataNo', label: 'खाता संख्या', english: 'Khata No' },
            { key: 'volume', label: 'भाग', english: 'Volume' },
            { key: 'plotNo', label: 'प्लाट संख्या', english: 'Plot No' },
            { key: 'pageNo', label: 'पृष्ठ संख्या', english: 'Page No' },
            { key: 'ujid', label: 'UJID', english: 'UJID' },
            { key: 'link', label: 'कार्रवाई', english: 'Action' }
        ];

        // State
        let currentPage = 1;
        let rowsPerPage = 50;
        let filteredData = [...rawData];
        let sortColumn = null;
        let sortDirection = 'asc';

        // Format number with commas
        function formatNumber(num) {
            if (num === null || num === undefined || num === '') return '';
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        // Format UJID number
        function formatUJID(ujid) {
            if (!ujid) return '';
            return ujid.toString();
        }

        // Initialize
        function init() {
            renderTable();
            updateStats();
        }

        // Render table
        function renderTable() {
            const start = (currentPage - 1) * (rowsPerPage === 'all' ? filteredData.length : rowsPerPage);
            const end = rowsPerPage === 'all' ? filteredData.length : Math.min(start + parseInt(rowsPerPage), filteredData.length);
            const pageData = filteredData.slice(start, end);

            // Render headers
            const thead = document.getElementById('tableHead');
            thead.innerHTML = `
                <tr>
                    ${columnHeaders.map((col, index) => `
                        <th onclick="sortTable(${index})" title="${col.english}">
                            ${col.label}
                            <span class="sort-icon ${sortColumn === index ? 'active' : ''}">
                                ${sortColumn === index ? (sortDirection === 'asc' ? '▲' : '▼') : '⇅'}
                            </span>
                        </th>
                    `).join('')}
                </tr>
            `;

            // Render body
            const tbody = document.getElementById('tableBody');
            if (pageData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="${columnHeaders.length}" class="no-data">
                            <i class="fas fa-search"></i>
                            <h3>कोई रिकॉर्ड नहीं मिला</h3>
                            <p>कृपया अपनी खोज को समायोजित करें</p>
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = pageData.map((row, rowIndex) => {
                    const actualIndex = start + rowIndex + 1;
                    return `
                        <tr>
                            ${row.map((cell, index) => {
                                if (index === 6) {
                                    // UJID column - show full integer with formatting
                                    return `<td class="number-cell"><span class="badge badge-purple">${formatUJID(cell)}</span></td>`;
                                } else if (index === 7) {
                                    // Link column
                                    return `<td><a href="${cell}" target="_blank" class="link-icon" data-tooltip="रिपोर्ट देखें">
                                        <i class="fas fa-external-link-alt"></i> देखें
                                    </a></td>`;
                                } else if (index === 0) {
                                    // SL No
                                    return `<td><span class="badge badge-blue">${actualIndex}</span></td>`;
                                } else if (index === 1) {
                                    // Rayat Name - Highlighted
                                    return `<td class="rayat-name"><i class="fas fa-user" style="color: #1a237e; margin-right: 8px;"></i>${cell}</td>`;
                                } else if (index === 2 || index === 4 || index === 5) {
                                    // Number columns (khata, plot, page)
                                    return `<td class="number-cell"><span class="badge ${index === 2 ? 'badge-orange' : 'badge-blue'}">${formatNumber(cell)}</span></td>`;
                                } else if (index === 3) {
                                    // Volume
                                    return `<td><span class="badge ${cell === '2' ? 'badge-green' : cell === '3' ? 'badge-teal' : 'badge-red'}">${cell}</span></td>`;
                                } else {
                                    return `<td>${cell}</td>`;
                                }
                            }).join('')}
                        </tr>
                    `;
                }).join('');
            }

            updatePagination();
            updateStats();
        }

        // Update pagination
        function updatePagination() {
            const totalPages = rowsPerPage === 'all' ? 1 : Math.ceil(filteredData.length / parseInt(rowsPerPage));
            const start = (currentPage - 1) * (rowsPerPage === 'all' ? filteredData.length : parseInt(rowsPerPage)) + 1;
            const end = Math.min(start + (rowsPerPage === 'all' ? filteredData.length : parseInt(rowsPerPage)) - 1, filteredData.length);

            document.getElementById('paginationInfo').textContent = 
                `दिखा रहा है ${filteredData.length === 0 ? 0 : start} से ${filteredData.length === 0 ? 0 : end} तक कुल ${filteredData.length} रिकॉर्ड`;

            const controls = document.getElementById('paginationControls');
            if (totalPages <= 1) {
                controls.innerHTML = '';
                return;
            }

            let html = `
                <button class="pagination-btn" onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fas fa-angle-double-left"></i>
                </button>
                <button class="pagination-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fas fa-angle-left"></i>
                </button>
            `;

            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);

            if (startPage > 1) {
                html += `<button class="pagination-btn" onclick="goToPage(1)">1</button>`;
                if (startPage > 2) html += `<button class="pagination-btn" disabled>...</button>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<button class="pagination-btn" disabled>...</button>`;
                html += `<button class="pagination-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            html += `
                <button class="pagination-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    <i class="fas fa-angle-right"></i>
                </button>
                <button class="pagination-btn" onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>
                    <i class="fas fa-angle-double-right"></i>
                </button>
            `;

            controls.innerHTML = html;
        }

        // Update stats
        function updateStats() {
            document.getElementById('totalRecords').textContent = formatNumber(rawData.length);
            document.getElementById('totalPages').textContent = rowsPerPage === 'all' ? 1 : Math.ceil(filteredData.length / parseInt(rowsPerPage));
            document.getElementById('displayCount').textContent = formatNumber(filteredData.length);
        }

        // Filter table
        function filterTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const filterType = document.getElementById('filterSelect').value;

            filteredData = rawData.filter(row => {
                // Search filter - check all columns including Hindi text
                let matchesSearch = true;
                if (searchTerm) {
                    matchesSearch = row.some(cell => 
                        cell.toString().toLowerCase().includes(searchTerm)
                    );
                }
                if (!matchesSearch) return false;

                // Column filter
                if (filterType === 'volume') {
                    return row[3] === '2' || row[3] === '3' || row[3] === '8';
                } else if (filterType === 'khata') {
                    return parseInt(row[2]) > 50;
                } else if (filterType === 'plot') {
                    return parseInt(row[4]) > 500;
                } else if (filterType === 'rayat') {
                    return row[1].toLowerCase().includes('शिवानन्द') || row[1].toLowerCase().includes('shivanand');
                }
                return true;
            });

            currentPage = 1;
            renderTable();
        }

        // Sort table
        function sortTable(columnIndex) {
            if (sortColumn === columnIndex) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = columnIndex;
                sortDirection = 'asc';
            }

            filteredData.sort((a, b) => {
                let valA = a[columnIndex];
                let valB = b[columnIndex];

                // Handle numeric values
                if (!isNaN(valA) && !isNaN(valB)) {
                    valA = parseFloat(valA);
                    valB = parseFloat(valB);
                }

                if (typeof valA === 'string' && typeof valB === 'string') {
                    return sortDirection === 'asc' ? valA.localeCompare(valB, 'hi') : valB.localeCompare(valA, 'hi');
                }

                if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
                if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });

            renderTable();
        }

        // Go to page
        function goToPage(page) {
            const totalPages = rowsPerPage === 'all' ? 1 : Math.ceil(filteredData.length / parseInt(rowsPerPage));
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
        }

        // Change rows per page
        function changeRowsPerPage() {
            rowsPerPage = document.getElementById('rowsPerPage').value;
            currentPage = 1;
            renderTable();
        }

        // Reset filters
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterSelect').value = 'all';
            filteredData = [...rawData];
            sortColumn = null;
            sortDirection = 'asc';
            currentPage = 1;
            renderTable();
        }

        // Print table
        function printTable() {
            window.print();
        }

        // Export CSV with full integers and Hindi text
        function exportCSV() {
            if (filteredData.length === 0) {
                alert('कोई डेटा नहीं है!');
                return;
            }

            const headers = columnHeaders.map(col => col.english);
            const BOM = '\uFEFF';
            
            let csvContent = BOM + headers.join(',') + '\n';
            
            filteredData.forEach(row => {
                const rowData = row.slice(0, 7);
                const escapedRow = rowData.map(cell => {
                    if (typeof cell === 'string' && (cell.includes(',') || cell.includes('"') || cell.includes('\n'))) {
                        return `"${cell.replace(/"/g, '""')}"`;
                    }
                    return cell;
                });
                csvContent += escapedRow.join(',') + '\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `jamabandi_data_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
