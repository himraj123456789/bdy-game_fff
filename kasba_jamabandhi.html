<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>जमाबंदी रजिस्टर</title>
<style>
  :root{
    --paper:#f6f1e6;
    --paper-alt:#efe7d6;
    --ink:#2a231a;
    --ink-soft:#5c5140;
    --maroon:#7a2e2e;
    --maroon-dark:#5c1f1f;
    --gold:#ad8a3c;
    --line:#d8cbaa;
    --line-strong:#b9a877;
    --card-shadow: 0 1px 3px rgba(42,35,26,0.12);
    --radius: 10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #fbf7ec 0%, var(--paper) 55%),
      var(--paper);
    color:var(--ink);
    font-family: "Noto Sans Devanagari","Noto Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* subtle ledger texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 27px,
      rgba(122,46,46,0.045) 28px
    );
    pointer-events:none;
    z-index:0;
  }

  header.top{
    position:relative;
    z-index:1;
    background: linear-gradient(180deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    color:#f4e9d8;
    padding: 18px 16px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  header.top .eyebrow{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#e3c98f;
    margin-bottom:4px;
    font-weight:600;
  }
  header.top h1{
    margin:0;
    font-size: clamp(20px, 5.5vw, 28px);
    font-weight:700;
    line-height:1.25;
  }
  header.top .sub{
    margin-top:6px;
    font-size:13px;
    color:#e9dcc2;
    opacity:0.9;
  }

  .toolbar{
    position: sticky;
    top:0;
    z-index:20;
    background: var(--paper);
    border-bottom:1px solid var(--line-strong);
    padding: 10px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    box-shadow: 0 2px 6px rgba(42,35,26,0.06);
  }
  .search-row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .search-wrap{
    position:relative;
    flex:1;
  }
  .search-wrap input{
    width:100%;
    padding: 11px 14px 11px 38px;
    border-radius: 999px;
    border:1.5px solid var(--line-strong);
    background:#fff;
    font-size:15px;
    color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{
    border-color: var(--maroon);
    box-shadow: 0 0 0 3px rgba(122,46,46,0.12);
  }
  .search-wrap svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    width:16px; height:16px;
    color: var(--ink-soft);
  }
  .count-pill{
    font-size:12px;
    white-space:nowrap;
    color: var(--maroon-dark);
    background: #f0e2c9;
    border:1px solid var(--gold);
    padding:6px 10px;
    border-radius:999px;
    font-weight:600;
  }
  .view-toggle{
    display:flex;
    gap:6px;
  }
  .view-toggle button{
    flex:1;
    padding:8px 10px;
    border-radius:8px;
    border:1.5px solid var(--line-strong);
    background:#fff;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:600;
    cursor:pointer;
  }
  .view-toggle button.active{
    background: var(--maroon);
    border-color: var(--maroon);
    color:#fff;
  }

  main{
    position:relative;
    z-index:1;
    padding: 12px 12px 40px;
    max-width: 1100px;
    margin:0 auto;
  }

  /* ---------- CARD VIEW (mobile-first) ---------- */
  #cardList{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .rcard{
    background:#fffdf8;
    border:1px solid var(--line);
    border-left:4px solid var(--maroon);
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: var(--card-shadow);
  }
  .rcard .rc-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
    margin-bottom:8px;
    border-bottom:1px dashed var(--line);
    padding-bottom:8px;
  }
  .rcard .rc-serial{
    font-size:12px;
    font-weight:700;
    color:var(--maroon-dark);
    background:#f0e2c9;
    border-radius:6px;
    padding:2px 8px;
  }
  .rcard .rc-name{
    font-size:16.5px;
    font-weight:700;
    color:var(--ink);
    flex:1;
  }
  .rc-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:6px 14px;
  }
  .rc-field{
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .rc-field .rc-label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-soft);
  }
  .rc-field .rc-value{
    font-size:13.5px;
    color:var(--ink);
    font-weight:600;
    word-break:break-word;
  }
  .rc-field.wide{
    grid-column: 1 / -1;
  }
  .rc-field .rc-value.mono{
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .rc-link-wrap{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    display:flex;
    justify-content:flex-end;
  }
  .rc-link-btn, .table-link-btn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:7px 16px;
    border-radius:999px;
    background: var(--maroon);
    color:#fff !important;
    font-size:12.5px;
    font-weight:700;
    text-decoration:none;
    border:1px solid var(--maroon-dark);
  }
  .rc-link-btn:active, .table-link-btn:active{
    opacity:0.85;
  }
  .rc-link-disabled, .table-link-disabled{
    background:#e6ddc8;
    color: var(--ink-soft) !important;
    border-color: var(--line-strong);
    cursor:default;
  }
  .table-link-btn{
    padding:5px 12px;
    font-size:12px;
    white-space:nowrap;
  }

  /* ---------- TABLE VIEW (wider screens) ---------- */
  .table-wrap{
    display:none;
    overflow-x:auto;
    border-radius: var(--radius);
    border:1px solid var(--line-strong);
    box-shadow: var(--card-shadow);
    background:#fffdf8;
  }
  table{
    border-collapse:collapse;
    width:100%;
    min-width: 780px;
    font-size:13.5px;
  }
  thead th{
    position:sticky;
    top:0;
    background: var(--maroon);
    color:#f6ead1;
    text-align:left;
    padding:10px 12px;
    font-weight:600;
    font-size:12.5px;
    white-space:nowrap;
    border-right:1px solid rgba(255,255,255,0.12);
  }
  tbody td{
    padding:9px 12px;
    border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);
    color:var(--ink);
    white-space:nowrap;
  }
  tbody td.wrap-name{
    white-space:normal;
    min-width:180px;
    font-weight:600;
  }
  tbody tr:nth-child(odd){ background: var(--paper-alt); }
  tbody tr:hover{ background:#f0e2c9; }

  .empty-state{
    text-align:center;
    padding: 40px 16px;
    color: var(--ink-soft);
  }
  .empty-state .big{
    font-size:15px;
    font-weight:600;
    color: var(--ink);
    margin-bottom:4px;
  }

  .pager{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .pager button{
    padding:8px 14px;
    border-radius:8px;
    border:1.5px solid var(--line-strong);
    background:#fff;
    color:var(--maroon-dark);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .pager button:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .pager .pageinfo{
    font-size:13px;
    color:var(--ink-soft);
    min-width:110px;
    text-align:center;
  }

  footer.foot{
    text-align:center;
    color: var(--ink-soft);
    font-size:11.5px;
    padding: 18px 12px 28px;
    position:relative;
    z-index:1;
  }

  @media (min-width: 760px){
    #cardList{ display:none; }
    .table-wrap{ display:block; }
    .toolbar{ flex-direction:row; align-items:center; }
    .search-row{ flex:1; }
    .view-toggle{ width:auto; }
    .view-toggle button{ flex:none; padding:8px 16px; }
  }

  @media (max-width: 759px){
    .table-wrap.force-show{ display:block; }
    .table-wrap.force-show ~ #cardList{ display:none; }
    #cardList.force-hide{ display:none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">भूमि सुधार एवं राजस्व विभाग</div>
  <h1>जमाबंदी रजिस्टर</h1>
  <div class="sub">कुल <span id="totalCount">6275</span> जमाबंदी अभिलेख — नाम, खाता व पृष्ठ संख्या से खोजें</div>
</header>

<div class="toolbar">
  <div class="search-row">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="searchInput" type="text" inputmode="search" placeholder="नाम, खाता संख्या, जमाबंदी संख्या से खोजें...">
    </div>
    <span class="count-pill" id="matchCount">6275 रिकॉर्ड</span>
  </div>
  <div class="view-toggle" id="viewToggle">
    <button data-view="card" class="active">कार्ड दृश्य</button>
    <button data-view="table">तालिका दृश्य</button>
  </div>
</div>

<main>
  <div id="cardList"></div>

  <div class="table-wrap" id="tableWrap">
    <table>
      <thead>
        <tr id="tableHeadRow"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">कोई रिकॉर्ड नहीं मिला</div>
    <div>कृपया दूसरे शब्द से खोजने का प्रयास करें</div>
  </div>

  <div class="pager" id="pager">
    <button id="prevBtn">‹ पिछला</button>
    <span class="pageinfo" id="pageInfo">पृष्ठ 1</span>
    <button id="nextBtn">अगला ›</button>
  </div>
</main>

<footer class="foot">जमाबंदी डेटा — मोबाइल के लिए अनुकूलित दृश्य</footer>

const HEADER = DATA.h; // 8 columns
const ROWS = DATA.r;

document.getElementById('totalCount').textContent = ROWS.length.toLocaleString('hi-IN');
document.getElementById('matchCount').textContent = ROWS.length.toLocaleString('hi-IN') + ' रिकॉर्ड';

// Column indices based on known header order:
// 0 क्रम संख्या, 1 रैयत का नाम, 2 खाता संख्या, 3 भाग वर्त्तमान,
// 4 पृष्ठ संख्या वर्त्तमान, 5 जमाबन्दी संख्या, 6 कंप्यूटरीकृत जमाबन्दी संख्या, 7 देखे

let filtered = ROWS;
let currentPage = 1;
const PAGE_SIZE = 100;
let currentView = 'card';

function normalize(s){
  return (s||'').toString().toLowerCase();
}

function applySearch(q){
  q = normalize(q).trim();
  if(!q){
    filtered = ROWS;
  } else {
    filtered = ROWS.filter(row => row.some(cell => normalize(cell).includes(q)));
  }
  currentPage = 1;
  render();
}

function buildJamabandiUrl(khata, computerJbNo){
  const k = (khata||'').toString().trim();
  const u = (computerJbNo||'').toString().trim();
  if(!k || !u) return null; // computerized jamabandi number missing/blank -> no valid link
  const base = 'https://emutation.bihar.gov.in/biharBhumireport/Reg2Report';
  const params = 'd=9&c=7&s=01&h=1&m=249%2f2&v=6+++++++++&p=1';
  return `${base}?${params}&k=${encodeURIComponent(k)}&u=${encodeURIComponent(u)}`;
}

function buildTableHead(){
  const tr = document.getElementById('tableHeadRow');
  tr.innerHTML = '';
  HEADER.forEach(h=>{
    const th = document.createElement('th');
    th.textContent = h;
    tr.appendChild(th);
  });
  const linkTh = document.createElement('th');
  linkTh.textContent = 'जमाबंदी लिंक';
  tr.appendChild(linkTh);
}

function escapeHtml(str){
  return (str||'').toString()
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function renderCards(pageRows){
  const wrap = document.getElementById('cardList');
  wrap.innerHTML = '';
  const frag = document.createDocumentFragment();
  pageRows.forEach(row=>{
    const [sr, name, khata, bhag, prishtha, jbNo, computerJbNo] = row;
    const card = document.createElement('div');
    card.className = 'rcard';
    card.innerHTML = `
      <div class="rc-top">
        <span class="rc-serial">#${escapeHtml(sr)}</span>
        <span class="rc-name">${escapeHtml(name) || '—'}</span>
      </div>
      <div class="rc-grid">
        <div class="rc-field">
          <span class="rc-label">खाता संख्या</span>
          <span class="rc-value">${escapeHtml(khata) || '—'}</span>
        </div>
        <div class="rc-field">
          <span class="rc-label">भाग वर्त्तमान</span>
          <span class="rc-value">${escapeHtml(bhag) || '—'}</span>
        </div>
        <div class="rc-field">
          <span class="rc-label">पृष्ठ संख्या</span>
          <span class="rc-value">${escapeHtml(prishtha) || '—'}</span>
        </div>
        <div class="rc-field">
          <span class="rc-label">जमाबन्दी संख्या</span>
          <span class="rc-value">${escapeHtml(jbNo) || '—'}</span>
        </div>
        <div class="rc-field wide">
          <span class="rc-label">कंप्यूटरीकृत जमाबन्दी संख्या</span>
          <span class="rc-value mono">${escapeHtml(computerJbNo) || '—'}</span>
        </div>
      </div>
    `;
    const linkUrl = buildJamabandiUrl(khata, computerJbNo);
    const linkWrap = document.createElement('div');
    linkWrap.className = 'rc-link-wrap';
    if(linkUrl){
      linkWrap.innerHTML = `<a class="rc-link-btn" href="${linkUrl}" target="_blank" rel="noopener noreferrer">जमाबंदी</a>`;
    } else {
      linkWrap.innerHTML = `<span class="rc-link-btn rc-link-disabled">जमाबंदी अनुपलब्ध</span>`;
    }
    card.appendChild(linkWrap);
    frag.appendChild(card);
  });
  wrap.appendChild(frag);
}

function renderTable(pageRows){
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  const frag = document.createDocumentFragment();
  pageRows.forEach(row=>{
    const tr = document.createElement('tr');
    row.forEach((cell, i)=>{
      const td = document.createElement('td');
      if(i===1) td.className = 'wrap-name';
      td.textContent = cell || '—';
      tr.appendChild(td);
    });
    const linkTd = document.createElement('td');
    const linkUrl = buildJamabandiUrl(row[2], row[6]);
    if(linkUrl){
      linkTd.innerHTML = `<a class="table-link-btn" href="${linkUrl}" target="_blank" rel="noopener noreferrer">जमाबंदी</a>`;
    } else {
      linkTd.innerHTML = `<span class="table-link-btn table-link-disabled">अनुपलब्ध</span>`;
    }
    tr.appendChild(linkTd);
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);
}

function render(){
  const total = filtered.length;
  document.getElementById('matchCount').textContent = total.toLocaleString('hi-IN') + ' रिकॉर्ड';

  const emptyState = document.getElementById('emptyState');
  const cardList = document.getElementById('cardList');
  const tableWrap = document.getElementById('tableWrap');
  const pager = document.getElementById('pager');

  if(total === 0){
    emptyState.style.display = 'block';
    cardList.innerHTML = '';
    document.getElementById('tableBody').innerHTML = '';
    pager.style.display = 'none';
    return;
  } else {
    emptyState.style.display = 'none';
    pager.style.display = 'flex';
  }

  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageRows = filtered.slice(start, start + PAGE_SIZE);

  renderCards(pageRows);
  renderTable(pageRows);

  document.getElementById('pageInfo').textContent = `पृष्ठ ${currentPage} / ${totalPages}`;
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= totalPages;

  // apply view
  if(currentView === 'card'){
    cardList.style.display = '';
    tableWrap.classList.remove('force-show');
  } else {
    tableWrap.classList.add('force-show');
  }
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  applySearch(e.target.value);
});

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(currentPage>1){ currentPage--; render(); window.scrollTo({top:0, behavior:'smooth'}); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  currentPage++; render(); window.scrollTo({top:0, behavior:'smooth'});
});

document.getElementById('viewToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  currentView = btn.dataset.view;
  document.querySelectorAll('#viewToggle button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

buildTableHead();
render();
</script>
